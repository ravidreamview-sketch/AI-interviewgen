name: Deploy to Google Cloud Run

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main
        type: choice
        options:
          - main

permissions:
  contents: read

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}

jobs:
  build-test-push-deploy:
    name: Build, test, push, and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set image variables
        id: image
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY_HOST="${REGION}-docker.pkg.dev"
          IMAGE_URI="${REGISTRY_HOST}/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_TAG="${IMAGE_URI}:${GITHUB_SHA}"

          echo "registry_host=${REGISTRY_HOST}" >> "${GITHUB_OUTPUT}"
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build Docker image
        run: docker build --tag "${{ steps.image.outputs.image_tag }}" .

      - name: Run tests inside the Docker image
        run: >-
          docker run --rm
          --env ENV=development
          --env DEV_AUTH_BYPASS=false
          "${{ steps.image.outputs.image_tag }}"
          pytest -q

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry_host }}
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Push Docker image
        run: docker push "${{ steps.image.outputs.image_tag }}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          image: ${{ steps.image.outputs.image_tag }}
          region: ${{ vars.GCP_REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          env_vars: |
            ENV=${{ vars.ENV }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            ADMIN_JWT_SECRET=${{ secrets.ADMIN_JWT_SECRET }}
            SUPER_ADMIN_EMAIL=${{ secrets.SUPER_ADMIN_EMAIL }}
            SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            ADMIN_ALLOWED_ORIGINS=${{ vars.ADMIN_ALLOWED_ORIGINS }}
            APP_URL=${{ vars.APP_URL }}
            ADMIN_TOKEN_EXPIRE_MINUTES=${{ vars.ADMIN_TOKEN_EXPIRE_MINUTES }}
            INVITATION_DISPLAY_EMAIL=${{ vars.INVITATION_DISPLAY_EMAIL }}
          flags: >-
            --port=8000
            --allow-unauthenticated

      - name: Verify Cloud Run health endpoint
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          test -n "${SERVICE_URL}"
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "${SERVICE_URL}/health"
