<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ravi GenAI Studio — Candidate Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#08141E;      --paper-2:#0D2130;    --sheet:#112B3E;
  --ink:#F8FAFC;        --ink-soft:#94A3B8;   --ink-faint:#64748B;
  --board:#050D14;      --board-2:#0A1926;    --board-ink:#F8FAFC;
  --primary:#34D399;    --primary-dark:#10B981; --primary-forest:#15803D;
  --primary-grad:linear-gradient(135deg, #166534 0%, #15803D 50%, #16A34A 100%);
  --emerald-grad:linear-gradient(135deg, #059669 0%, #10B981 50%, #34D399 100%);
  --pen:#34D399;        --pen-soft:#6EE7B7;   --pen-wash:rgba(16, 185, 129, 0.15);
  --label-color:#34D399;
  --rule:#1A364E;       --rule-soft:#132738;
  --gold:#FBBF24;       --pass:#34D399;       --err:#F87171; --err-wash:rgba(239, 68, 68, 0.15);
  --shadow:0 14px 40px -10px rgba(0, 0, 0, 0.6);
  --radius:16px;
  --f-ui:"Inter",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono","Inter",ui-monospace,monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100vh;height:100%}
body{
  background:var(--paper-2);color:var(--ink);
  font-family:var(--f-ui);font-size:15px;line-height:1.5;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow-x:hidden;
}

.bg-glow {
  position: absolute;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(16, 185, 129, 0.18) 0%, rgba(6, 182, 212, 0.08) 50%, transparent 70%);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.login-card {
  width: 100%;
  max-width: 440px;
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 40px 36px;
  box-shadow: var(--shadow);
  position: relative;
  z-index: 10;
  backdrop-filter: blur(16px);
}

.brand-header {
  text-align: center;
  margin-bottom: 28px;
}

.brand-logo-row {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}

.brand-logo-img {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 0 18px rgba(56, 189, 248, 0.45), 0 0 10px rgba(129, 140, 248, 0.4);
  border: 1.5px solid rgba(56, 189, 248, 0.6);
  background: #08141E;
}

.brand-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.15;
  color: #FFF;
}

.brand-title .brand-name {
  color: #38BDF8;
}

.brand-title .brand-ai {
  background: linear-gradient(135deg, #818CF8 0%, #C084FC 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.brand-sub {
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #94A3B8;
  margin-top: 2px;
  font-weight: 700;
}

.subtitle {
  color: var(--ink-soft);
  font-size: 14px;
  margin-top: 6px;
}

.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  margin-bottom: 8px;
}

.form-input {
  width: 100%;
  padding: 12px 16px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 10px;
  color: var(--ink);
  font-family: inherit;
  font-size: 14px;
  transition: all 0.2s ease;
}

.form-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
}

.btn-primary {
  width: 100%;
  padding: 15px 24px;
  background: linear-gradient(135deg, #166534 0%, #15803D 50%, #16A34A 100%);
  border: 1px solid rgba(52, 211, 153, 0.3);
  box-shadow: 0 8px 24px rgba(22, 163, 74, 0.4);
  border-radius: 14px;
  color: #FFF;
  font-weight: 700;
  font-size: 15.5px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  margin-top: 10px;
}
.btn-primary:hover {
  filter: brightness(1.08);
  transform: translateY(-2px);
  box-shadow: 0 12px 30px -4px rgba(22, 163, 74, 0.55);
}

.btn-primary:active {
  transform: translateY(0);
}

.alert-box {
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 20px;
  display: none;
}

.alert-error {
  background: var(--err-wash);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: var(--err);
}

.forgot-link {
  display: block;
  text-align: center;
  margin-top: 18px;
  font-size: 13px;
  color: var(--ink-soft);
  text-decoration: none;
  transition: color 0.2s;
}

.forgot-link:hover {
  color: var(--pen);
  text-decoration: underline;
}

.admin-switch {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--rule);
  text-align: center;
  font-size: 13px;
  color: var(--ink-faint);
}

.admin-switch a {
  color: var(--label-color);
  font-weight: 500;
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="login-card">
  <div class="brand-header">
    <div class="brand-logo">
      <span>RaviGen AI Interview Studio</span>
    </div>
    <div class="subtitle">Candidate Login</div>
  </div>

  <div id="errorBox" class="alert-box alert-error"></div>

  <form id="candidateLoginForm" method="POST" action="javascript:void(0);" onsubmit="handleCandidateLogin(event)">
    <div class="form-group">
      <label class="form-label" for="candidateEmail">Email / Username</label>
      <input type="email" id="candidateEmail" class="form-input" value="candidate@example.com" placeholder="candidate@example.com" autocomplete="email" required />
    </div>

    <div class="form-group">
      <label class="form-label" for="candidatePassword">Password</label>
      <input type="password" id="candidatePassword" class="form-input" value="CandidatePass123!" placeholder="••••••••••••" autocomplete="current-password" required />
    </div>

    <button type="submit" id="submitBtn" class="btn-primary">Sign In</button>
  </form>

  <a href="#" onclick="showForgotNotice(event)" class="forgot-link">Forgot password?</a>

  <div class="admin-switch">
    Are you an Administrator? <a href="/admin">Sign in to Admin Console</a>
  </div>
</div>

<script src="/analytics-tracker.js"></script>
<script>
function fillCandidateCreds() {
  document.getElementById('candidateEmail').value = 'candidate@example.com';
  document.getElementById('candidatePassword').value = 'CandidatePass123!';
}

async function handleCandidateLogin(event) {
  if (event) event.preventDefault();
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');
  const emailInput = document.getElementById('candidateEmail');
  const email = (emailInput && emailInput.value ? emailInput.value : 'candidate@example.com').trim();
  const password = document.getElementById('candidatePassword')?.value || 'CandidatePass123!';

  if (errorBox) {
    errorBox.style.display = 'none';
    errorBox.textContent = '';
  }
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing In...';
  }

  try {
    const res = await fetch("/api/candidate/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "include",
      body: JSON.stringify({
        email: email,
        password: password
      })
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      const msg = errData.detail || errData.message || 'Invalid credentials. Please verify your email and password.';
      if (errorBox) {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
      }
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
      return;
    }

    const data = await res.json().catch(() => ({}));
    if (data && data.user) {
      localStorage.setItem('candidate_user', JSON.stringify({
        email: data.user.email,
        name: data.user.full_name || 'Candidate',
        role: data.user.role || 'candidate',
        plan: (data.user.plan_tier || 'PRO').toUpperCase() + ' Plan'
      }));
    }

    const targetUrl = window.location.protocol === 'file:' ? 'Interview-studio.html' : '/candidate/interview-studio';
    window.location.href = targetUrl;
  } catch (err) {
    if (errorBox) {
      errorBox.textContent = 'Network or server error during sign in. Please try again.';
      errorBox.style.display = 'block';
    }
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  }
}

function showForgotNotice(e) {
  e.preventDefault();
  alert('If you forgot your password, please contact your administrator to reset your credentials.');
}
</script>
</body>
</html>
