<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ravi GenAI Studio — Candidate Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#070A12;      --paper-2:#0E1424;    --sheet:#131D33;
  --ink:#F8FAFC;        --ink-soft:#94A3B8;   --ink-faint:#64748B;
  --board:#04070D;      --board-2:#111827;    --board-ink:#F8FAFC;
  --primary:#6366F1;    --primary-grad:linear-gradient(135deg, #3B82F6 0%, #6366F1 50%, #8B5CF6 100%);
  --pen:#818CF8;        --pen-soft:#A5B4FC;   --pen-wash:rgba(99, 102, 241, 0.15);
  --label-color:#60A5FA;
  --rule:#1E293B;       --rule-soft:#151F32;
  --gold:#FBBF24;       --pass:#34D399;       --err:#F87171; --err-wash:rgba(239, 68, 68, 0.15);
  --shadow:0 14px 40px -10px rgba(0, 0, 0, 0.6);
  --radius:16px;
  --f-ui:"Roboto",system-ui,-apple-system,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100vh;height:100%}
body{
  background:var(--paper-2);color:var(--ink);
  font-family:var(--f-ui);font-size:15px;line-height:1.5;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow-x:hidden;
}

.bg-glow {
  position: absolute;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(59, 130, 246, 0.05) 50%, transparent 70%);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.login-card {
  width: 100%;
  max-width: 440px;
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 40px 36px;
  box-shadow: var(--shadow);
  position: relative;
  z-index: 10;
  backdrop-filter: blur(16px);
}

.brand-header {
  text-align: center;
  margin-bottom: 28px;
}

.brand-logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 22px;
  color: #FFF;
  letter-spacing: -0.5px;
}

.brand-logo span {
  background: var(--primary-grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  color: var(--ink-soft);
  font-size: 14px;
  margin-top: 6px;
}

.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  margin-bottom: 8px;
}

.form-input {
  width: 100%;
  padding: 12px 16px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 10px;
  color: var(--ink);
  font-family: inherit;
  font-size: 14px;
  transition: all 0.2s ease;
}

.form-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
}

.btn-primary {
  width: 100%;
  padding: 14px;
  background: var(--primary-grad);
  border: none;
  border-radius: 10px;
  color: #FFF;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  transition: transform 0.15s ease, opacity 0.15s ease;
  margin-top: 10px;
}

.btn-primary:hover {
  opacity: 0.95;
  transform: translateY(-1px);
}

.btn-primary:active {
  transform: translateY(0);
}

.alert-box {
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 20px;
  display: none;
}

.alert-error {
  background: var(--err-wash);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: var(--err);
}

.forgot-link {
  display: block;
  text-align: center;
  margin-top: 18px;
  font-size: 13px;
  color: var(--ink-soft);
  text-decoration: none;
  transition: color 0.2s;
}

.forgot-link:hover {
  color: var(--pen);
  text-decoration: underline;
}

.admin-switch {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--rule);
  text-align: center;
  font-size: 13px;
  color: var(--ink-faint);
}

.admin-switch a {
  color: var(--label-color);
  font-weight: 500;
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="login-card">
  <div class="brand-header">
    <div class="brand-logo">
      <span>Ravi GenAI Studio</span>
    </div>
    <div class="subtitle">Candidate Login</div>
  </div>

  <div id="errorBox" class="alert-box alert-error"></div>

  <form id="candidateLoginForm" onsubmit="handleCandidateLogin(event)">
    <div class="form-group">
      <label class="form-label" for="candidateEmail">Email / Username</label>
      <input type="email" id="candidateEmail" class="form-input" placeholder="candidate@example.com" required autocomplete="email" />
    </div>

    <div class="form-group">
      <label class="form-label" for="candidatePassword">Password</label>
      <input type="password" id="candidatePassword" class="form-input" placeholder="••••••••••••" required autocomplete="current-password" />
    </div>

    <button type="submit" id="submitBtn" class="btn-primary">Sign In</button>
  </form>

  <a href="#" onclick="showForgotNotice(event)" class="forgot-link">Forgot password?</a>

  <div class="admin-switch">
    Are you an Administrator? <a href="/admin">Sign in to Admin Console</a>
  </div>
</div>

<script src="/analytics-tracker.js"></script>
<script>
async function handleCandidateLogin(event) {
  event.preventDefault();
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');
  const email = document.getElementById('candidateEmail').value.trim();
  const password = document.getElementById('candidatePassword').value;

  errorBox.style.display = 'none';
  errorBox.textContent = '';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Authenticating...';

  try {
    let response = await fetch('/candidate/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Requested-With': 'XMLHttpRequest'
      },
      body: JSON.stringify({ email, password })
    });

    if (response.status === 404) {
      response = await fetch('/api/candidate/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Requested-With': 'XMLHttpRequest'
        },
        body: JSON.stringify({ email, password })
      });
    }

    const data = await response.json();

    if (!response.ok) {
      const errMsg = data.detail || 'Invalid email or password.';
      errorBox.textContent = errMsg;
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
      return;
    }

    // Store user details without storing tokens in localStorage
    localStorage.removeItem('candidate_token');
    if (data.user) {
      localStorage.setItem('candidate_user', JSON.stringify(data.user));
    }

    // Redirect directly to Candidate Interview Studio Workspace (Public Page)
    window.location.href = window.location.protocol === 'file:' ? 'Interview-studio.html' : '/candidate/interview-studio';

  } catch (err) {
    errorBox.textContent = 'Connection error. Please try again.';
    errorBox.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign In';
  }
}

function showForgotNotice(e) {
  e.preventDefault();
  alert('If you forgot your password, please contact your administrator to reset your credentials.');
}
</script>
</body>
</html>
